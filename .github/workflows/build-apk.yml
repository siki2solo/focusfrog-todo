name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Assemble & Sign Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Parse version from app/build.gradle.kts
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          echo "name=${VERSION_NAME:-1.0}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE:-1}" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Release Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/release-keystore.p12"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -storetype PKCS12 -storepass "focustodo-ci-key" -alias focustodo -keypass "focustodo-ci-key" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FocusTodo, OU=Android, O=FocusTodo, L=Unknown, S=Unknown, C=US"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=focustodo-ci-key" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=focustodo" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=focustodo-ci-key" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Stage versioned APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FocusTodo-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}-release.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusTodo-v${{ steps.version.outputs.name }}-release
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: FocusFrog Todo v${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})
          files: dist/*.apk
          generate_release_notes: true
